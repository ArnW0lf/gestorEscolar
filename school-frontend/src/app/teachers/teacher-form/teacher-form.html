<div class="teacher-form-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ pageTitle }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="spinner-container" *ngIf="isLoading">
        <mat-progress-spinner color="primary" mode="indeterminate"></mat-progress-spinner>
      </div>

      <form [formGroup]="teacherForm" (ngSubmit)="onSubmit()" [hidden]="isLoading">
        <mat-form-field appearance="fill">
          <mat-label>Full Name</mat-label>
          <input matInput formControlName="nombre" required>
          <mat-error *ngIf="teacherForm.get('nombre')?.hasError('required')">
            Full name is required.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Specialty</mat-label>
          <input matInput formControlName="especialidad" required>
          <mat-error *ngIf="teacherForm.get('especialidad')?.hasError('required')">
            Specialty is required.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Email</mat-label>
          <input matInput formControlName="correo" type="email" required>
          <mat-error *ngIf="teacherForm.get('correo')?.hasError('required')">
            Email is required.
          </mat-error>
          <mat-error *ngIf="teacherForm.get('correo')?.hasError('email')">
            Please enter a valid email address.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Subjects Taught</mat-label>
          <mat-select formControlName="materias" multiple>
            <mat-option *ngFor="let subject of availableSubjects" [value]="subject.id">
              {{subject.nombre}} ({{subject.codigo || 'No Code'}})
            </mat-option>
          </mat-select>
          <!-- No specific error message for 'materias' unless made required -->
        </mat-form-field>

        <div class="form-actions">
          <button mat-raised-button color="primary" type="submit" [disabled]="teacherForm.invalid || isLoading">
            {{ isEditMode ? 'Update' : 'Create' }} Teacher
          </button>
          <button mat-stroked-button type="button" (click)="onCancel()" [disabled]="isLoading">
            Cancel
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
