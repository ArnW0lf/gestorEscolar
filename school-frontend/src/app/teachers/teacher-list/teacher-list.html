<div class="teacher-list-container admin-section-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Teachers</mat-card-title>
      <button mat-raised-button color="primary" (click)="navigateToCreate()" class="add-button">
        <mat-icon>add</mat-icon> Add Teacher
      </button>
    </mat-card-header>
    <mat-card-content>
      <mat-form-field appearance="standard">
        <mat-label>Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Jane Doe" #input>
      </mat-form-field>

      <div class="spinner-container" *ngIf="isLoading">
        <mat-progress-spinner color="primary" mode="indeterminate"></mat-progress-spinner>
      </div>

      <div class="table-container" [hidden]="isLoading">
        <table mat-table [dataSource]="dataSource" matSort>

          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
            <td mat-cell *matCellDef="let teacher"> {{teacher.id}} </td>
          </ng-container>

          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
            <td mat-cell *matCellDef="let teacher"> {{teacher.nombre}} </td>
          </ng-container>

          <ng-container matColumnDef="especialidad">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Specialty </th>
            <td mat-cell *matCellDef="let teacher"> {{teacher.especialidad}} </td>
          </ng-container>

          <ng-container matColumnDef="correo">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
            <td mat-cell *matCellDef="let teacher"> {{teacher.correo}} </td>
          </ng-container>

          <ng-container matColumnDef="materias">
            <th mat-header-cell *matHeaderCellDef> Subjects Taught </th>
            <td mat-cell *matCellDef="let teacher">
              <mat-chip-listbox aria-label="Subjects">
                <mat-chip *ngFor="let subjectId of teacher.materias">
                  {{ getSubjectNames([subjectId]) }}
                </mat-chip>
                <span *ngIf="!teacher.materias || teacher.materias.length === 0">N/A</span>
              </mat-chip-listbox>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Actions </th>
            <td mat-cell *matCellDef="let teacher">
              <button mat-icon-button color="primary" (click)="editTeacher(teacher.id!)" matTooltip="Edit Teacher">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteTeacher(teacher.id!, teacher.nombre)" matTooltip="Delete Teacher">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="6" *ngIf="!isLoading">No data matching the filter "{{input.value}}" or no teachers found.</td>
          </tr>
        </table>
        <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page of teachers">
        </mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
