<div class="student-list-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Students</mat-card-title>
      <button mat-raised-button color="primary" (click)="navigateToCreate()" class="add-button">
        <mat-icon>add</mat-icon> Add Student
      </button>
    </mat-card-header>
    <mat-card-content>
      <mat-form-field appearance="fill">
        <mat-label>Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ex. John Doe" #input>
      </mat-form-field>

      <div class="spinner-container" *ngIf="isLoading">
        <mat-progress-spinner color="primary" mode="indeterminate"></mat-progress-spinner>
      </div>

      <div class="table-container" [hidden]="isLoading">
        <table mat-table [dataSource]="dataSource" matSort>

          <!-- ID Column -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
            <td mat-cell *matCellDef="let student"> {{student.id}} </td>
          </ng-container>

          <!-- Nombre Column -->
          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
            <td mat-cell *matCellDef="let student"> {{student.nombre}} </td>
          </ng-container>

          <!-- Apellido Column -->
          <ng-container matColumnDef="apellido">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Last Name </th>
            <td mat-cell *matCellDef="let student"> {{student.apellido}} </td>
          </ng-container>

          <!-- DNI Column -->
          <ng-container matColumnDef="dni">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> DNI </th>
            <td mat-cell *matCellDef="let student"> {{student.dni}} </td>
          </ng-container>

          <!-- Grado Column -->
          <ng-container matColumnDef="grado">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Grade </th>
            <td mat-cell *matCellDef="let student"> {{student.grado}} </td>
          </ng-container>

          <!-- Sección Column -->
          <ng-container matColumnDef="seccion">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Section </th>
            <td mat-cell *matCellDef="let student"> {{student.seccion}} </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Actions </th>
            <td mat-cell *matCellDef="let student">
              <button mat-icon-button color="primary" (click)="editStudent(student.id!)" matTooltip="Edit Student">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="deleteStudent(student.id!, student.nombre + ' ' + student.apellido)" matTooltip="Delete Student">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <!-- Row shown when there is no matching data. -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="7" *ngIf="!isLoading">No data matching the filter "{{input.value}}" or no students found.</td>
          </tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page of students">
        </mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
